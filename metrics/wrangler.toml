# 배포는 반드시 설정을 명시한다: npx wrangler deploy --config metrics/wrangler.toml
# (레포 루트의 wrangler.* 가 배포를 가로챈 사고가 있다 — server/wrangler.toml 머리말 참고)
#
# 비밀값은 여기 쓰지 않는다. 사용자가 직접 넣는다:
#   npx wrangler secret put APP_TOKEN         --config metrics/wrangler.toml
#   npx wrangler secret put AE_API_TOKEN      --config metrics/wrangler.toml
#   npx wrangler secret put SLACK_WEBHOOK_URL --config metrics/wrangler.toml
name = "etavia-metrics"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true
head_sampling_rate = 1

# 매일 18:00 KST(=09:00 UTC) 한 번. 리포트는 직전 24시간을 덮는다(index.ts → window.ts)
# 매시 리포트는 2026-09-27 에 하루 한 번으로 바꿨다
[triggers]
crons = ["0 9 * * *"]

[vars]
# 와일드카드로 열지 않는다. 데모 오리진과 로컬 확인용만
ALLOWED_ORIGINS = "https://etavia-demo.picpal.workers.dev,http://localhost:8080"
DEMO_URL = "https://etavia-demo.picpal.workers.dev"
# 계정 id 는 비밀값이 아니다(대시보드 URL 에 그대로 있다). KV 네임스페이스 id 를
# server/wrangler.toml 에 두는 것과 같은 취급.
AE_ACCOUNT_ID = "0735fc1b945ba922944da9c6fa7aa3f6"

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "etavia_metrics"
