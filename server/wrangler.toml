# 배포는 반드시 설정을 명시한다: npx wrangler deploy --config wrangler.toml
# 2026-09-17 사고 — `wrangler pages deploy` 가 레포 루트에 wrangler.jsonc 를 만들었다.
# 뒤이은 wrangler deploy 가 이 파일 대신 그 루트 설정을 집었고, 하필 루트 설정의 name 이
# 이 워커와 같은 "etavia" 였던 탓에 API 워커가 정적 웹 데모로 덮어써졌다(/route 404).
# 루트 설정이 왜 집혔는지는 못 밝혔다 — `cd server && npx wrangler deploy` 처럼 한 셸
# 호출로 묶어 돌렸는데도 그랬다(wrangler 4.133). cwd 만 맞추는 걸로는 못 막으니 --config 를 쓴다.
name = "etavia"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 로그 보존. 이게 없으면 console.error 는 `wrangler tail` 로 붙어 있는 동안에만 보인다 —
# kvWrite.ts 가 남기는 `[kv.put failed] site=... ` 는 드물게 터지는 것이라 붙어 있을 때
# 터져 줄 리가 없다. 켜야 대시보드에서 뒤늦게 셀 수 있다.
# 키는 로그에 절대 안 들어간다(`rlip:<path>:<ip>:<minute>` 에 사용자 IP 가 들어 있다 —
# kvWrite.test.ts 가 회귀를 막는다). 그래서 보존해도 안전하다.
[observability]
enabled = true
head_sampling_rate = 1

# 웹 데모 오리진 허용 목록. 비어 있으면 CORS 헤더를 안 붙인다 = 네이티브 전용.
# 데모를 배포하면 그 도메인을 여기 추가할 것 — 와일드카드로 열지 않는다.
[vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:8081,https://etavia-demo.picpal.workers.dev"
TRANSIT_PROVIDER = "google"

# 무료 티어 KV — 기기당 rate limit 카운터만 쓴다
# npx wrangler kv namespace create RATE
[[kv_namespaces]]
binding = "RATE"
id = "0df33cb5e6da4860859f804300485429"

# 바깥 응답 캐시 — 블로그 24시간, 구글 14일. RATE 와 용도가 달라 따로 둔다
# npx wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "8d5b43b63d4145589f306da232a2a02f"

# 비밀은 파일에 두지 않는다
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put APP_TOKEN
#   npx wrangler secret put KAKAO_MOBILITY_KEY   # developers.kakaomobility.com 키 (카카오 로컬 키와 별개)
#   npx wrangler secret put GOOGLE_ROUTES_KEY   # 없으면 GOOGLE_PLACES_KEY 사용 (같은 키에 Routes API 허용 필요)
