name = "etavia"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 웹 데모 오리진 허용 목록. 비어 있으면 CORS 헤더를 안 붙인다 = 네이티브 전용.
# 데모를 배포하면 그 도메인을 여기 추가할 것 — 와일드카드로 열지 않는다.
[vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:8081,https://etavia-demo.picpal.workers.dev"
TRANSIT_PROVIDER = "google"

# 무료 티어 KV — 기기당 rate limit 카운터만 쓴다
# npx wrangler kv namespace create RATE
[[kv_namespaces]]
binding = "RATE"
id = "0df33cb5e6da4860859f804300485429"

# 바깥 응답 캐시 — 블로그 24시간, 구글 14일. RATE 와 용도가 달라 따로 둔다
# npx wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "8d5b43b63d4145589f306da232a2a02f"

# 비밀은 파일에 두지 않는다
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put APP_TOKEN
#   npx wrangler secret put KAKAO_MOBILITY_KEY   # developers.kakaomobility.com 키 (카카오 로컬 키와 별개)
#   npx wrangler secret put GOOGLE_ROUTES_KEY   # 없으면 GOOGLE_PLACES_KEY 사용 (같은 키에 Routes API 허용 필요)
